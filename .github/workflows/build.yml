name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: bash scripts/check.sh
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Build signed app
        run: bash scripts/build-app.sh
      - name: Package Apple silicon app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/OziRegionMirror.app build/OziRegionMirror-macos-arm64.zip
          cd build
          shasum -a 256 OziRegionMirror-macos-arm64.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OziRegionMirror-macos-arm64
          path: |
            build/OziRegionMirror-macos-arm64.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "OziRegionMirror $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md build/OziRegionMirror-macos-arm64.zip build/SHA256SUMS.txt
    permissions:
      contents: write
